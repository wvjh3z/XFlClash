# release-package.yml — 形态 A 多端「正式安装包」CI（FlClash 同款打包：setup.exe /
# AppImage+deb+rpm / dmg / 多 ABI apk）。**唯一出包入口**（原 release-build.yml 裸目录产物
# workflow 已删除，功能被本 workflow 覆盖；裸目录调试需求改用本地 build_local.sh /
# package_desktop_local.sh）。
#
# 设计：复用 FlClash 的 flutter_distributor（vendored 在 plugins/flutter_distributor/，
#   打包配置在 <platform>/packaging/*/make_config.yaml）出 dist/ 正式包。
#   **不走 dart setup.dart**（它会把 env.json 覆盖成 {APP_ENV,CORE_SHA256} 丢掉 XB_* defines），
#   改为：自己预合成 env.json（含全部 XB_* defines + formA + Sentry DSN）→ 直接调
#   `flutter_distributor package --flutter-build-args=dart-define-from-file=env.json,...`，
#   既拿到 FlClash 同款打包产物，又保住反腐层/品牌/签名/Sentry 全部注入。
#
# 产物（按 flavor，对齐 FlClash release 资产）：
#   android : <app>-android-arm64-v8a.apk / -armeabi-v7a.apk / -x86_64.apk（split-per-abi）
#   windows : <app>-windows-amd64-setup.exe
#   linux   : amd64 → .AppImage / .deb / .rpm；arm64 → .deb
#   macos   : amd64 → .dmg；arm64 → .dmg
#
# 机密链路（GitHub repository secrets，与 release-build.yml 同）：
#   BRAND_A_FLAVOR_YAML_B64 / BRAND_B_FLAVOR_YAML_B64    flavors/<brand>/flavor.yaml（base64；含内嵌 aesKey+签名）
#   BRAND_A_FALLBACK_BIN_B64 / BRAND_B_FALLBACK_BIN_B64  flavors/<brand>/assets/fallback.bin（base64）
#   SIBLING_SDK_TOKEN   只读 private wvjh3z/Xboard_sdk 的 fine-grained PAT
#   SENTRY_AUTH_TOKEN   Sentry org auth token（sntrys_…，org=ka-chiu-lee；上传崩溃符号，缺失则跳过不阻断）
#
# ✅ Linux crashpad 可执行位：已由 linux/CMakeLists.txt 末尾 install(CODE chmod +x) 在
#   flutter build 时补回（PATCHES.md RT-CrashpadExec）。bundle/deb/AppImage 三格式本地实测
#   均 -rwxr-xr-x，CI 自动继承，无需在本工作流另行处理。
# ⚠️ Linux amd64 必须保持 ubuntu-22.04：其 rpm 为 4.17.x（旧 %install 行为），vendored
#   flutter_distributor 的 rpm maker 依赖此行为。ubuntu-24.04+ 的 rpm 4.20 改了 %install 工作目录
#   会导致 rpm 打包失败（本地 Debian13/rpm4.20 已复现）。**勿把 amd64 升到 ubuntu-latest/24.04**。

name: Release Package (multi-platform, flutter_distributor)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '品牌 flavor'
        type: choice
        options:
          - brand_a
          - brand_b
        default: brand_a
      target:
        description: '构建目标平台（一次一个；all=全部并行）'
        type: choice
        options:
          - android
          - windows-amd64
          - linux-amd64
          - linux-arm64
          - macos-amd64
          - macos-arm64
          - all
        default: android
      upload:
        description: '发布到草稿 Release（直链原文件，仅协作者可见，可随时删；测试期可开。false=只构建不发布）'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

# 发布到草稿 Release 需要 contents 写权限（gh release create/upload）。
permissions:
  contents: write

env:
  APP_ENV: stable
  GO_VERSION: 1.24.0
  FLAVOR: ${{ github.event.inputs.flavor || 'brand_a' }}
  SENTRY_ORG: ka-chiu-lee

jobs:
  # 解析 target 输入 → 动态 matrix。（job 级 if 不能用 matrix 上下文 → 之前 startup_failure，
  # 故改为 setup job 按 target 产出 matrix JSON，package job 用 fromJson 消费。）
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.r.outputs.include }}
    steps:
      - id: r
        env:
          TARGET: ${{ github.event.inputs.target || 'android' }}
        run: |
          set -euo pipefail
          A='{"platform":"android","os":"ubuntu-latest"}'
          WA='{"platform":"windows","os":"windows-2022","arch":"amd64"}'
          LA='{"platform":"linux","os":"ubuntu-22.04","arch":"amd64"}'
          LR='{"platform":"linux","os":"ubuntu-24.04-arm","arch":"arm64"}'
          MA='{"platform":"macos","os":"macos-15-intel","arch":"amd64"}'
          MR='{"platform":"macos","os":"macos-latest","arch":"arm64"}'
          case "$TARGET" in
            android)       INC="[$A]" ;;
            windows-amd64) INC="[$WA]" ;;
            linux-amd64)   INC="[$LA]" ;;   # ubuntu-22.04 固定（rpm 4.20 坑，见头部）
            linux-arm64)   INC="[$LR]" ;;
            macos-amd64)   INC="[$MA]" ;;
            macos-arm64)   INC="[$MR]" ;;
            all)           INC="[$A,$WA,$LA,$LR,$MA,$MR]" ;;
            *)             echo "未知 target: $TARGET"; exit 1 ;;
          esac
          echo "include=$INC" >> "$GITHUB_OUTPUT"
          echo "选定 matrix: $INC"

  package:
    needs: setup
    name: ${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }} (${{ github.event.inputs.flavor || 'brand_a' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.include) }}
    steps:
      - name: Checkout client (XFlClash)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Xboard_sdk (sibling, private)
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_SDK_TOKEN }}@github.com/wvjh3z/Xboard_sdk.git" \
            "${GITHUB_WORKSPACE}/../Xboard_sdk"
          echo "✓ Xboard_sdk 已 clone 到 sibling"

      - name: Restore flavor secrets
        env:
          A_YAML: ${{ secrets.BRAND_A_FLAVOR_YAML_B64 }}
          A_BIN:  ${{ secrets.BRAND_A_FALLBACK_BIN_B64 }}
          B_YAML: ${{ secrets.BRAND_B_FLAVOR_YAML_B64 }}
          B_BIN:  ${{ secrets.BRAND_B_FALLBACK_BIN_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "flavors/${FLAVOR}/assets"
          if [ "$FLAVOR" = "brand_b" ]; then YAML="$B_YAML"; BIN="$B_BIN"; else YAML="$A_YAML"; BIN="$A_BIN"; fi
          echo "secret 原始长度: YAML=${#YAML} BIN=${#BIN}"
          # 可移植解码：tr 去空白 + base64 -d（GNU/macOS BSD/Git-Bash 均支持 -d；secret 由 API 写入已干净）。
          printf '%s' "$YAML" | tr -d '[:space:]' | base64 -d > "flavors/${FLAVOR}/flavor.yaml" || { echo "✗ flavor.yaml base64 解码失败"; exit 1; }
          printf '%s' "$BIN"  | tr -d '[:space:]' | base64 -d > "flavors/${FLAVOR}/assets/fallback.bin" || { echo "✗ fallback.bin base64 解码失败"; exit 1; }
          echo "解码后大小: flavor.yaml=$(wc -c < "flavors/${FLAVOR}/flavor.yaml") fallback.bin=$(wc -c < "flavors/${FLAVOR}/assets/fallback.bin")"
          grep -q 'appName' "flavors/${FLAVOR}/flavor.yaml" || { echo "✗ flavor.yaml 还原失败（缺 appName；BRAND_*_FLAVOR_YAML_B64 可能被截断，需重新完整粘贴）"; head -c 200 "flavors/${FLAVOR}/flavor.yaml"; exit 1; }
          echo "✓ flavor.yaml / fallback.bin 已还原（flavor=${FLAVOR}）"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup NDK (Android)
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      # 注：windows-arm64 已移除（desktop_webview_window 插件 ARM64 链接 WebView2 失败 LNK1120；
      # FlClash 自身 release 也无 win-arm64；win-arm 用户用 amd64 包经 Windows x64 仿真运行）。
      # 故 win-arm 专属的 Setup rust 步骤 + flutter master 分支的 windows-11-arm 条件一并清除。

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      # 非 arm runner 用 stable 3.41.9（与 release-build.yml 一致）；
      # arm runner（ubuntu-24.04-arm）按 FlClash 惯例走 master 3.44.0-0.1.pre。
      - name: Setup Flutter (stable)
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Setup Flutter (master, arm runner)
        if: ${{ startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.44.0-0.1.pre
          cache: true

      - name: Enable desktop
        if: matrix.platform != 'android'
        run: flutter config --enable-windows-desktop --enable-linux-desktop --enable-macos-desktop

      - name: Get Flutter dependency
        run: |
          flutter --version
          flutter pub get

      # µ-8 顺序：SDK build_runner → client build_runner。
      - name: SDK build_runner
        working-directory: ../Xboard_sdk
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Client codegen
        run: dart run build_runner build --delete-conflicting-outputs

      # prepare_flavor 生成 flavor_defines.json（含真实 aesKey）。Android 额外 --android-signing
      # 落地 keystore.jks + local.properties。多 ABI 打包：删掉 prepare_flavor 写的 XB_TARGET_ABI，
      # 让 split-per-abi 出全部 ABI（versionCode 由 flutter 按 abi 偏移，FlClash 同款语义）。
      - name: Prepare flavor
        run: |
          set -euo pipefail
          EXTRA=""
          [ "${{ matrix.platform }}" = "android" ] && EXTRA="--android-signing"
          dart run tool/prepare_flavor.dart --flavor "$FLAVOR" --target prod $EXTRA
          if [ "${{ matrix.platform }}" = "android" ]; then
            sed -i '/^XB_TARGET_ABI=/d' android/local.properties || true
            echo "✓ 已移除 XB_TARGET_ABI（split-per-abi 出全部 ABI）"
          fi

      # 桌面品牌注入（appName → 窗口标题 / 打包 make_config display_name 等）+ 图标重生成。
      - name: Inject desktop branding
        if: matrix.platform != 'android'
        run: dart run tool/inject_desktop_brand.dart --flavor "$FLAVOR"

      - name: Generate desktop icons
        if: matrix.platform != 'android'
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      # distribute_options.yaml 的 app_name（影响产物文件名前缀 + rpm spec 的 Name:/二进制名/
      # 路径标识 %{name} + Exec/Icon）按 flavor 的 appName 校正。⚠️ rpm 的 Name: 必须 ASCII 且无
      # 空格（中文如「袋鼠加速」会触发 `Illegal char` MakeError）；deb/AppImage/dmg/exe 的「可见
      # 品牌名」走各自 make_config 的 display_name（inject_desktop_brand 注入中文，不受此处影响）。
      # 故此处对 appName 做 ASCII 净化（去非 ASCII / 空格）；净化后为空（纯中文 appName）则回退到
      # ASCII 的 updatePackageName（omo / ds）。最终产物名由 Normalize 步骤统一收口，前缀不影响交付。
      - name: Align package app_name to flavor
        run: |
          set -euo pipefail
          APP_NAME="$(grep -m1 -E '^[[:space:]]*appName:' "flavors/${FLAVOR}/flavor.yaml" | sed -E 's/.*appName:[[:space:]]*"?([^"#]+)"?.*/\1/' | xargs)"
          ASCII_NAME="$(printf '%s' "$APP_NAME" | LC_ALL=C tr -cd 'A-Za-z0-9_.-')"
          if [ -z "$ASCII_NAME" ]; then
            ASCII_NAME="$(grep -m1 -E '^[[:space:]]*updatePackageName:' "flavors/${FLAVOR}/flavor.yaml" | sed -E 's/.*updatePackageName:[[:space:]]*"?([^"#]+)"?.*/\1/' | xargs)"
            echo "ℹ appName「${APP_NAME}」非 ASCII → app_name 回退到 updatePackageName「${ASCII_NAME}」（rpm Name: 合法性）"
          fi
          # 可移植 in-place（BSD sed -i 需参数；用临时文件避开）。
          if [ -n "$ASCII_NAME" ]; then
            sed -E "s/^app_name:.*/app_name: '${ASCII_NAME}'/" distribute_options.yaml > distribute_options.yaml.tmp && mv distribute_options.yaml.tmp distribute_options.yaml
          fi
          echo "=== distribute_options.yaml ==="; cat distribute_options.yaml

      # Windows：先编 Go 核心取 CORE_SHA256（编译期 define，运行时核心完整性校验）。
      - name: Build Go core + read CORE_SHA256 (Windows)
        if: matrix.platform == 'windows'
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          set -euo pipefail
          dart pub get
          dart run build_tool windows --root-dir "$GITHUB_WORKSPACE"

      # 合成 env.json（flavor_defines + APP_ENV + CORE_SHA256 + XB_FORM_A + 版本/构建号/tag）。
      - name: Compose env.json
        run: |
          set -euo pipefail
          TAG="$(date +%Y%m%d%H%M)"
          PV="$(grep -m1 -E '^[[:space:]]*versionName:' "flavors/${FLAVOR}/flavor.yaml" | sed -E 's/.*versionName:[[:space:]]*"?([^"#]+)"?.*/\1/' | xargs)"
          BN="$(cat "scripts/build_number.${FLAVOR}.txt" 2>/dev/null || echo 1)"
          SHA=""
          [ -f core_sha256.json ] && SHA="$(jq -r '.CORE_SHA256 // ""' core_sha256.json)"
          jq -n \
            --argjson flavor "$(cat flavor_defines.json)" \
            --arg env "$APP_ENV" --arg sha "$SHA" --arg tag "$TAG" --arg pv "$PV" --arg bn "$BN" \
            '$flavor + {APP_ENV:$env, CORE_SHA256:$sha, XB_FORM_A:"true", XB_BUILD_TAG:$tag, XB_PRODUCT_VERSION:$pv, XB_BUILD_NUMBER:$bn}' \
            > env.json
          echo "=== env.json (脱敏 XB_AES_KEY_B64) ==="; jq 'del(.XB_AES_KEY_B64)' env.json
          echo "PRODUCT_VERSION=$PV" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "BASE_VERSION=$(grep -m1 -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9.]+).*/\1/' | xargs)" >> "$GITHUB_ENV"

      # macOS 打包依赖：appdmg（dmg 制作）。
      - name: Install macOS package deps
        if: matrix.platform == 'macos'
        run: npm install -g appdmg

      # Linux 打包依赖：gtk/appindicator/keybinder + AppImage 所需 patchelf/libfuse2/appimagetool
      # （amd64 + arm64 都出 AppImage，appimagetool 按 arch 选）；rpm 仅 amd64。
      - name: Install Linux package deps
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev locate
          # 桌面 WebView（desktop_webview_window）需 webkit2gtk-4.1 + libsoup-3.0（插件 CMake REQUIRED）。
          # sentry-native（原生崩溃上报）CMake find_package(CURL) 需 libcurl dev。
          # flutter_secure_storage_linux 需 libsecret-1 + jsoncpp（arm64 runner 不自带）。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libcurl4-openssl-dev libsecret-1-dev libjsoncpp-dev
          # AppImage 需要 patchelf + FUSE（libfuse2；ubuntu 24.04 改名 libfuse2t64，兜底）。
          sudo apt-get install -y patchelf
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y rpm   # rpm 仅 amd64 出
            AIT_ARCH=x86_64
          else
            AIT_ARCH=aarch64
          fi
          sudo wget -O /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${AIT_ARCH}.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool

      # 激活 vendored flutter_distributor，加到 PATH。
      - name: Activate flutter_distributor
        run: |
          set -euo pipefail
          dart pub global activate -s path plugins/flutter_distributor/packages/flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          # Windows pub-cache bin 路径不同。
          if [ "${{ matrix.platform }}" = "windows" ]; then echo "$LOCALAPPDATA/Pub/Cache/bin" >> "$GITHUB_PATH"; fi

      # 打包：按平台选 targets，喂我们的 env.json + split-debug-info（Sentry 符号）。
      # android 加 split-per-abi 出 3 个 ABI 包。
      - name: Package (flutter_distributor)
        run: |
          set -euo pipefail
          # 版本：与 release-build.yml 一致——build-name=底座版本 / build-number=build_number.txt，
          # 否则 flutter_distributor 回退 pubspec 版本号（大日期数），两工作流 versionCode 语义不一致。
          COMMON="dart-define-from-file=env.json,build-name=$BASE_VERSION,build-number=$BUILD_NUMBER"
          case "${{ matrix.platform }}" in
            android) TARGETS="apk"; BUILD_ARGS="$COMMON,split-debug-info=build/debug-info,split-per-abi,flavor=$FLAVOR" ;;
            windows) TARGETS="exe"; BUILD_ARGS="$COMMON,split-debug-info=build/debug-info" ;;
            macos)   TARGETS="dmg"; BUILD_ARGS="$COMMON" ;;  # macos 不支持 --split-debug-info（用 sentry-cocoa 原生 + dSYM 上传）
            linux)
              if [ "${{ matrix.arch }}" = "amd64" ]; then TARGETS="deb,appimage,rpm"; else TARGETS="deb,appimage"; fi
              BUILD_ARGS="$COMMON,split-debug-info=build/debug-info" ;;
          esac
          DESC=""
          [ "${{ matrix.platform }}" != "android" ] && DESC="--description ${{ matrix.arch }}"
          dart pub global run flutter_distributor:main package \
            --skip-clean \
            --platform "${{ matrix.platform }}" \
            --targets "$TARGETS" \
            --flutter-build-args="$BUILD_ARGS" \
            $DESC

      # 重命名 dist 产物为 AppVersion 插件/FlClash 约定名：
      #   {updatePackageName}-{产品版本}-{平台}-{archToken}{后缀}
      # 客户端 v0.3 自更新按此规则拼下载 URL（后端 AppVersion 插件自动拼文件名），
      # 镜像上的文件名必须精确匹配，否则 404。flutter_distributor 默认名（含 -brand_x
      # 后缀 + 底座版本 + 缺 -平台- 段）对不上，故在此统一收口。
      - name: Normalize artifact names (AppVersion convention)
        run: |
          set -euo pipefail
          PKG="$(grep -m1 -E '^[[:space:]]*updatePackageName:' "flavors/${FLAVOR}/flavor.yaml" | sed -E 's/.*updatePackageName:[[:space:]]*"?([^"#]+)"?.*/\1/' | xargs)"
          [ -n "$PKG" ] || { echo "✗ flavor.yaml 缺 updatePackageName"; exit 1; }
          PV="$PRODUCT_VERSION"
          AR="${{ matrix.arch }}"
          cd dist
          shopt -s nullglob
          case "${{ matrix.platform }}" in
            android)
              for abi in armeabi-v7a arm64-v8a x86_64; do
                for f in *"$abi"*.apk; do mv -f "$f" "${PKG}-${PV}-android-${abi}.apk"; done
              done ;;
            windows)
              for f in *setup.exe; do mv -f "$f" "${PKG}-${PV}-windows-${AR}-setup.exe"; done ;;
            macos)
              for f in *.dmg; do mv -f "$f" "${PKG}-${PV}-macos-${AR}.dmg"; done ;;
            linux)
              for f in *.AppImage; do mv -f "$f" "${PKG}-${PV}-linux-${AR}.AppImage"; done
              for f in *.deb;      do mv -f "$f" "${PKG}-${PV}-linux-${AR}.deb"; done
              for f in *.rpm;      do mv -f "$f" "${PKG}-${PV}-linux-${AR}.rpm"; done ;;
          esac
          echo "=== dist 重命名后（AppVersion 约定）==="; ls -la

      # Sentry 符号上传（缺 SENTRY_AUTH_TOKEN → 跳过不阻断）。
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then echo "⚠ 无 SENTRY_AUTH_TOKEN → 跳过符号上传"; exit 0; fi
          if [ "$FLAVOR" = "brand_b" ]; then PROJECT=daishu; else PROJECT=omofly; fi
          npm install -g @sentry/cli >/dev/null 2>&1 || npm install -g @sentry/cli
          sentry-cli debug-files upload --include-sources --project "$PROJECT" build/debug-info || echo "⚠ Dart 符号上传失败（非阻断）"
          case "${{ matrix.platform }}" in
            android) sentry-cli debug-files upload --project "$PROJECT" build/app/intermediates/merged_native_libs 2>/dev/null || true ;;
            linux)   sentry-cli debug-files upload --project "$PROJECT" build/linux 2>/dev/null || true ;;
            windows) sentry-cli debug-files upload --project "$PROJECT" build/windows 2>/dev/null || true ;;
            macos)   sentry-cli debug-files upload --project "$PROJECT" build/macos/Build/Products/Release 2>/dev/null || true ;;
          esac
          echo "✓ 符号上传步骤完成"

      # 列出产物清单（始终执行，便于核对构建/打包/命名是否正常，但不上传）。
      - name: List built artifacts (no upload)
        run: |
          echo "=== dist 产物（验证构建+命名；upload=${{ github.event.inputs.upload }}）==="
          ls -la dist/ 2>/dev/null || echo "(无 dist)"

      # 发布到草稿 Release（upload=true 时）。
      # 为什么用草稿 Release 而非 Artifacts：① Artifacts 下载永远是 zip 包，不是直接的安装包；
      # ② 草稿 Release 的资产是直链原文件（omo-x.y.z-...-setup.exe 直接下），且**仅仓库协作者可见**
      # （公众看不到），测完可随时删。完美匹配"测试期要真安装包又不公开"。
      # 并行 matrix 多 job 发到同一个草稿（tag=pkg-<flavor>-v<版本>）：幂等创建 + --clobber 覆盖，
      # 不同平台文件名不同不冲突；重跑同版本会覆盖同名资产。草稿不创建 git tag，不污染 tag 列表。
      - name: Publish to draft Release
        if: github.event.inputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: pkg-${{ env.FLAVOR }}-v${{ env.PRODUCT_VERSION }}
          TITLE: ${{ env.FLAVOR }} v${{ env.PRODUCT_VERSION }} (build ${{ env.BUILD_NUMBER }})
        run: |
          set -euo pipefail
          # 幂等创建草稿（并行 job 抢创建：后者命中"已存在"→ || true 不致命）
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "${TITLE}" \
              --notes "自动构建（草稿，仅协作者可见，测试完可删）。flavor=${FLAVOR} 版本=${PRODUCT_VERSION} build=${BUILD_NUMBER}" \
              || true
          fi
          # 等草稿就绪（防并行创建竞态：本 job 没创建但另一 job 正在建）
          for i in $(seq 1 10); do
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && break
            echo "等待草稿 Release 就绪… (${i})"; sleep 3
          done
          # 上传本平台产物（直链原文件；--clobber 覆盖同名，便于重跑）
          # ⚠️ macOS /bin/bash 3.2：变量紧跟中文必须用 ${VAR} 花括号，否则会吞字节报 unbound（PATCHES 经验 #3）
          gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          echo "✓ 已发布到草稿 Release：${TAG}（仅协作者可见，直链下载真安装包）"

  # 发布成功后，把该 flavor 的 versionCode +1 并提交回仓库（下次发布自动用新号）。
  # 仅 upload=true（真发布）才自增——纯构建验证（upload=false）不消耗版本号。
  # needs: package → 仅当所有平台 job 成功才跑（任一失败不自增，避免号空耗）。
  # a/b 各自独立计数：scripts/build_number.<flavor>.txt，互不影响。
  bump:
    needs: package
    if: github.event.inputs.upload == 'true'
    name: Bump versionCode (next release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main, 可推回)
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Increment build_number for flavor
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'brand_a' }}
        run: |
          set -euo pipefail
          FILE="scripts/build_number.${FLAVOR}.txt"
          CUR="$(cat "$FILE" 2>/dev/null || echo 1)"
          NEXT=$((CUR + 1))
          echo "$NEXT" > "$FILE"
          git config user.name "anonymous"
          git config user.email "anonymous@users.noreply.github.com"
          git add "$FILE"
          git commit -m "[xfork] chore(build): ${FLAVOR} versionCode ${CUR}→${NEXT}（CI 发布后自增）"
          # 防与人工 push 竞态：rebase 重试（本工作流仅 workflow_dispatch，提交不会再触发 CI）
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "✓ ${FLAVOR} versionCode → ${NEXT}（已提交回仓库）"; exit 0
            fi
            echo "push 冲突，重试 ($i)…"; sleep 4
          done
          echo "✗ 自增提交推送失败（请手动检查 ${FILE}）"; exit 1
