# release-package.yml — 形态 A 多端「正式安装包」CI（FlClash 同款打包：setup.exe /
# AppImage+deb+rpm / dmg / 多 ABI apk）。**唯一出包入口**（原 release-build.yml 裸目录产物
# workflow 已删除，功能被本 workflow 覆盖；裸目录调试需求改用本地 build_local.sh /
# package_desktop_local.sh）。
#
# 设计：复用已固定版本的 flutter_distributor（独立源码缓存在 .local-build/tool-sources，
#   打包配置在 <platform>/packaging/*/make_config.yaml）出 dist/ 正式包。
#   品牌入口不走 dart setup.dart，避免上游定义文件生成覆盖 XB_* defines，
#   改为：自己预合成 env.json（含全部 XB_* defines + formA + Sentry DSN）→ 直接调
#   `flutter_distributor package --flutter-build-args=dart-define-from-file=env.json,...`，
#   既拿到 FlClash 同款打包产物，又保住反腐层/品牌/签名/Sentry 全部注入。
#
# 产物（按 flavor，对齐 FlClash release 资产）：
#   android : <app>-android-arm64-v8a.apk / -armeabi-v7a.apk（split-per-abi；x86_64 已去除，占比 <1%）
#   windows : <app>-windows-amd64-setup.exe
#   linux   : amd64 → .AppImage / .deb / .rpm；arm64 → .deb
#   macos   : amd64 → .dmg；arm64 → .dmg
#
# 机密链路（GitHub repository secrets，与 release-build.yml 同）：
#   BRAND_A_FLAVOR_YAML_B64 / BRAND_B_FLAVOR_YAML_B64    flavors/<brand>/flavor.yaml（base64；含内嵌 aesKey+签名）
#   BRAND_A_FALLBACK_BIN_B64 / BRAND_B_FALLBACK_BIN_B64  flavors/<brand>/assets/fallback.bin（base64）
#   SIBLING_SDK_TOKEN   只读 private wvjh3z/Xboard_sdk 的 fine-grained PAT
#   SENTRY_AUTH_TOKEN   正式出包所有平台必需的符号上传 Token（org=ka-chiu-lee）
#   后台配置独立使用 SENTRY_MAINTENANCE_TOKEN；本工作流仅显式验证时在独立验证 step 读取。
#
# ✅ Linux crashpad 可执行位：已由 linux/CMakeLists.txt 末尾 install(CODE chmod +x) 在
#   flutter build 时补回（PATCHES.md RT-CrashpadExec）。bundle/deb/AppImage 三格式本地实测
#   均 -rwxr-xr-x，CI 自动继承，无需在本工作流另行处理。
# ⚠️ Linux amd64 必须保持 ubuntu-22.04：其 rpm 为 4.17.x（旧 %install 行为），vendored
#   flutter_distributor 的 rpm maker 依赖此行为。ubuntu-24.04+ 的 rpm 4.20 改了 %install 工作目录
#   会导致 rpm 打包失败（本地 Debian13/rpm4.20 已复现）。**勿把 amd64 升到 ubuntu-latest/24.04**。

name: Release Package (multi-platform, flutter_distributor)
run-name: "${{ inputs.flavor }} · ${{ inputs.target }}${{ inputs.build_number && format(' · build {0}', inputs.build_number) || '' }}"

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '品牌 flavor'
        type: choice
        options:
          - brand_a
          - brand_b
        default: brand_a
      target:
        description: '构建目标（desktop=全部桌面；desktop-except-linux-amd64=跳过Linux x64；all=含Android）'
        type: choice
        options:
          - android
          - windows-amd64
          - linux-amd64
          - linux-arm64
          - macos-amd64
          - macos-arm64
          - desktop
          - desktop-except-linux-amd64
          - all
        default: android
      build_number:
        description: '构建号（可选）：留空自动使用仓库下一编号；也可手动指定更大编号'
        type: string
        required: false
        default: ''
      upload:
        description: '发布安装包到草稿 Release；false仍执行Sentry符号校验与上传'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

# 默认只读；仅草稿上传和编号回写各自 job 提权。
permissions:
  contents: read

env:
  APP_ENV: stable
  GO_VERSION: 1.27.1
  SENTRY_ORG: ka-chiu-lee

jobs:
  # 解析 target 输入 → 动态 matrix。（job 级 if 不能用 matrix 上下文 → 之前 startup_failure，
  # 故改为 setup job 按 target 产出 matrix JSON，package job 用 fromJson 消费。）
  setup:
    name: Resolve targets and build number
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.r.outputs.include }}
      build_number: ${{ steps.number.outputs.build_number }}
      flavor: ${{ steps.request.outputs.flavor }}
      upload: ${{ steps.request.outputs.upload }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      sdk_ref: ${{ steps.settings.outputs.sdk_ref }}
      verify_symbolication: ${{ steps.settings.outputs.verify_symbolication }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalize release request
        id: request
        run: python3 tool/release_request.py normalize
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          persist-credentials: false
      - name: Read pinned release settings
        id: settings
        env:
          BUILD_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: python3 tool/release_request.py config
      - name: Setup Python for shared release checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fast, secret-free gate: do not start six runners for one broken contract.
      - name: Static workflow and shell checks
        timeout-minutes: 5
        run: python3 tool/check_workflow_lints.py --prepare
      - name: Check clean distributor initialization
        timeout-minutes: 5
        run: python3 tool/test/distributor_checkout_test.py
      - name: Prepare pinned distributor for shared checks
        timeout-minutes: 5
        run: python3 tool/checkout_distributor.py
      - name: Check default packager preparation entrypoint
        run: python3 tool/prepare_linux_packager.py
      - name: Check shared release contracts
        timeout-minutes: 5
        run: python3 tool/check_release_workflow.py
      - id: r
        env:
          TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          A='{"platform":"android","os":"ubuntu-latest"}'
          WA='{"platform":"windows","os":"windows-2022","arch":"amd64"}'
          LA='{"platform":"linux","os":"ubuntu-22.04","arch":"amd64"}'
          LR='{"platform":"linux","os":"ubuntu-24.04-arm","arch":"arm64"}'
          MA='{"platform":"macos","os":"macos-15-intel","arch":"amd64"}'
          MR='{"platform":"macos","os":"macos-latest","arch":"arm64"}'
          case "$TARGET" in
            android)       INC="[$A]" ;;
            windows-amd64) INC="[$WA]" ;;
            linux-amd64)   INC="[$LA]" ;;   # ubuntu-22.04 固定（rpm 4.20 坑，见头部）
            linux-arm64)   INC="[$LR]" ;;
            macos-amd64)   INC="[$MA]" ;;
            macos-arm64)   INC="[$MR]" ;;
            desktop)       INC="[$WA,$LA,$LR,$MA,$MR]" ;;
            desktop-except-linux-amd64) INC="[$WA,$LR,$MA,$MR]" ;;
            all)           INC="[$A,$WA,$LA,$LR,$MA,$MR]" ;;
            *)             echo "未知 target: $TARGET"; exit 1 ;;
          esac
          echo "include=$INC" >> "$GITHUB_OUTPUT"
          echo "选定 matrix: $INC"
      - name: Resolve build number
        id: number
        env:
          FLAVOR: ${{ steps.request.outputs.flavor }}
          REQUESTED_BUILD_NUMBER: ${{ steps.request.outputs.requested_number }}
          BUILD_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BUILD_SOURCE_REF: ${{ steps.request.outputs.source_ref }}
        run: python3 tool/release_build_number.py resolve --flavor "$FLAVOR"

  package:
    needs: setup
    timeout-minutes: 150
    name: ${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }} (${{ needs.setup.outputs.flavor }}, build ${{ needs.setup.outputs.build_number }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 既有草稿 Release 上传。
    env:
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
      FLAVOR: ${{ needs.setup.outputs.flavor }}
      BUILD_SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
      SENTRY_MACOS_DIAGNOSTICS_DIR: ${{ matrix.platform == 'macos' && 'build/sentry-diagnostics/macos' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.include) }}
    steps:
      - name: Checkout client (XFlClash)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Setup Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify packaging Python
        run: |
          python - <<'PY'
          import sys
          print(f"Packaging Python: {sys.version.split()[0]} ({sys.executable})")
          if sys.version_info[:2] != (3, 12):
              raise SystemExit("Packaging requires Python 3.12")
          PY

      - name: Prepare pinned distributor source
        timeout-minutes: 10
        run: python tool/checkout_distributor.py

      - name: Check release workflow structure
        run: python tool/test/sentry_release_workflow_test.py ReleaseWorkflowStructureTests

      - name: Check shared package helper contracts
        run: python tool/test/release_pipeline_test.py

      - name: Check Windows WebView build rules
        if: matrix.platform == 'windows'
        run: python tool/test/windows_loader_install_test.py

      - name: Check Windows WebView shutdown ownership with MSVC
        if: matrix.platform == 'windows'
        run: python tool/test/windows_webview_shutdown_test.py

      - name: Check Windows runtime prerequisite rules
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & tool/test/windows_brand_installation_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tool/test/windows_vc_runtime_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tool/test/windows_vc_runtime_process_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/test/windows_vc_runtime_contract_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/test/windows_iscc_preflight_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch verified offline VC runtime
        timeout-minutes: 10
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & tool/windows/prepare_vc_runtime.ps1 -Root $env:GITHUB_WORKSPACE -DownloadOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Sentry CLI and verify symbol tooling
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = 'macos' ]; then
            mkdir -p "$SENTRY_MACOS_DIAGNOSTICS_DIR"
            rm -f "$SENTRY_MACOS_DIAGNOSTICS_DIR"/failure-0[0-9].json \
              "$SENTRY_MACOS_DIAGNOSTICS_DIR"/failure-1[0-5].json
            rm -f "$SENTRY_MACOS_DIAGNOSTICS_DIR"/unexpected.json \
              "$SENTRY_MACOS_DIAGNOSTICS_DIR"/reader-lifecycle.json \
              "$SENTRY_MACOS_DIAGNOSTICS_DIR"/reader-termination.json \
              "$SENTRY_MACOS_DIAGNOSTICS_DIR"/reader-test-eof.json \
              "$SENTRY_MACOS_DIAGNOSTICS_DIR"/reader-test-held.json
          fi
          npm install -g @sentry/cli@2.58.4
          python tool/test/owned_process_cleanup_test.py
          python tool/test/sentry_symbols_test.py
          python tool/test/sentry_android_inventory_test.py
          python tool/test/sentry_native_generation_test.py
          python tool/test/sentry_linux_inventory_test.py
          python tool/test/sentry_android_prefab_test.py
          python tool/test/sentry_macos_generation_test.py
          python tool/test/sentry_macos_spm_inventory_test.py
          python tool/test/sentry_macos_receipt_validation_test.py
          python tool/test/sentry_macos_symbols_test.py
          if [ "${{ matrix.platform }}" = 'macos' ]; then
            python tool/test/sentry_macos_reader_test.py
          fi
          python tool/test/local_release_automation_test.py
          python tool/test/android_release_contract_test.py
          python tool/test/python_text_encoding_test.py
          python tool/test/sentry_windows_rust_manifest_test.py
          python tool/test/sentry_symbolication_picker_test.py
          python tool/test/sentry_desktop_symbolication_probe_test.py
          python tool/test/sibling_sdk_checkout_test.py

      - name: Check required Sentry upload credentials
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::Release packaging requires SENTRY_AUTH_TOKEN for matching debug symbols"
            exit 1
          fi

      - name: Checkout Xboard_sdk (sibling, private)
        timeout-minutes: 10
        env:
          SDK_REF: ${{ needs.setup.outputs.sdk_ref }}
          SDK_READ_TOKEN: ${{ secrets.SIBLING_SDK_TOKEN }}
        run: |
          set -euo pipefail
          python tool/checkout_sibling_sdk.py --destination "${GITHUB_WORKSPACE}/../Xboard_sdk" --ref "$SDK_REF"

      - name: Restore flavor secrets
        env:
          A_YAML: ${{ secrets.BRAND_A_FLAVOR_YAML_B64 }}
          A_BIN:  ${{ secrets.BRAND_A_FALLBACK_BIN_B64 }}
          B_YAML: ${{ secrets.BRAND_B_FLAVOR_YAML_B64 }}
          B_BIN:  ${{ secrets.BRAND_B_FALLBACK_BIN_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "flavors/${FLAVOR}/assets"
          if [ "$FLAVOR" = "brand_b" ]; then YAML="$B_YAML"; BIN="$B_BIN"; else YAML="$A_YAML"; BIN="$A_BIN"; fi
          echo "secret 原始长度: YAML=${#YAML} BIN=${#BIN}"
          # 可移植解码：tr 去空白 + base64 -d（GNU/macOS BSD/Git-Bash 均支持 -d；secret 由 API 写入已干净）。
          printf '%s' "$YAML" | tr -d '[:space:]' | base64 -d > "flavors/${FLAVOR}/flavor.yaml" || { echo "✗ flavor.yaml base64 解码失败"; exit 1; }
          printf '%s' "$BIN"  | tr -d '[:space:]' | base64 -d > "flavors/${FLAVOR}/assets/fallback.bin" || { echo "✗ fallback.bin base64 解码失败"; exit 1; }
          echo "解码后大小: flavor.yaml=$(wc -c < "flavors/${FLAVOR}/flavor.yaml") fallback.bin=$(wc -c < "flavors/${FLAVOR}/assets/fallback.bin")"
          grep -q 'appName' "flavors/${FLAVOR}/flavor.yaml" || { echo "✗ flavor.yaml 还原失败（缺 appName；请核对BRAND_*_FLAVOR_YAML_B64）"; exit 1; }
          echo "✓ flavor.yaml / fallback.bin 已还原（flavor=${FLAVOR}）"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK (Android)
        id: android_ndk
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      # Windows ARM64 仍沿本项目暂缓决定；升级上游不自动扩大现有发行矩阵。

      - name: Bind pinned NDK environment (Android)
        if: matrix.platform == 'android'
        env:
          SELECTED_NDK: ${{ steps.android_ndk.outputs.ndk-path }}
        run: python tool/android_ndk_environment.py --path "$SELECTED_NDK" --github-env

      # gomobile uses clang --target; Go's ARM32 flag probe can miss Build ID.
      - name: Check Android Go symbol link contract
        if: matrix.platform == 'android'
        run: python tool/test/android_go_build_id_test.py

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      # Stable has no Linux ARM64 archive. Use the action's source install
      # path at the exact SAME stable commit; never follow floating master.
      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' && '5fc346839b5d0eef006ed8404392afb4dfae428d' || '3.47.6' }}
          channel: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' && 'master' || 'stable' }}
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: true

      - name: Select supported Xcode
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Use default Rust homes for Native Assets hooks
        shell: python
        run: |
          import os
          from pathlib import Path
          home = Path.home()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"CARGO_HOME={home / '.cargo'}\nRUSTUP_HOME={home / '.rustup'}\nRUSTUP_TOOLCHAIN=1.99.0\n")

      - name: Prepare native build inputs
        timeout-minutes: 20
        run: python tool/prepare_native_build.py --platform "${{ matrix.platform }}" --install-rust-targets

      - name: Client pub get
        timeout-minutes: 15
        run: python tool/pub_get_retry.py --tool flutter --enforce-lockfile --report build/dependency-retries/client.json

      - name: Check platform packager context
        timeout-minutes: 5
        run: python tool/test/packager_context_test.py

      - name: Check build tool encoding and launchers
        timeout-minutes: 5
        env:
          XFLCLASH_TEST_PLATFORM: ${{ matrix.platform }}
          XFLCLASH_REAL_LAUNCHER_TEST: '1'
        run: |
          python tool/test/native_release_migration_test.py
          python tool/test/native_launcher_test.py

      # µ-8 顺序：SDK build_runner → client build_runner。
      - name: SDK build_runner
        timeout-minutes: 20
        working-directory: ../Xboard_sdk
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/tool/pub_get_retry.py" --tool dart --enforce-lockfile --report "$GITHUB_WORKSPACE/build/dependency-retries/sdk.json"
          python "$GITHUB_WORKSPACE/tool/dart_package.py" build_runner build

      - name: Client codegen
        timeout-minutes: 20
        run: python "$GITHUB_WORKSPACE/tool/dart_package.py" build_runner build

      - name: Check Rust Native Assets symbol handoff
        timeout-minutes: 10
        run: python tool/flutter_check.py --no-pub plugins/rust_api/test/xboard_symbols_test.dart

      - name: Check desktop brand data isolation
        if: matrix.platform == 'linux'
        timeout-minutes: 10
        run: python tool/test/brand_data_runtime_test.py

      - name: Check setup build hooks
        timeout-minutes: 15
        working-directory: plugins/setup/setup_hooks
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/tool/pub_get_retry.py" --tool dart --enforce-lockfile --report "$GITHUB_WORKSPACE/build/dependency-retries/setup-hooks.json"
          dart test

      - name: Check real hook environment and symbol cache recovery
        timeout-minutes: 10
        run: |
          python tool/test/dart_package_test.py
          python tool/test/native_hook_environment_test.py

      - name: Check Android brand identity and task title
        if: matrix.platform == 'android'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python tool/flutter_check.py --no-pub tool/test/android_brand_identity_test.dart test/xboard/config/application_title_test.dart
          python tool/test/android_brand_identity_gradle_test.py
          python tool/test/android_version_gradle_test.py
          python tool/flutter_check.py --no-pub --dart-define=XB_NATIVE_ID=com.cloud.app.omofly --dart-define=XB_URL_SCHEME=com.cloud.app.omofly test/common/android_channel_identity_test.dart
          python tool/flutter_check.py --no-pub --dart-define=XB_NATIVE_ID=com.cloud.app.daishu --dart-define=XB_URL_SCHEME=com.cloud.app.daishu test/common/android_channel_identity_test.dart

      - name: Check fallback selection before brand injection
        run: python tool/dart_package.py test tool/test/fallback_assets_test.dart

      # prepare_flavor 生成 flavor_defines.json（含真实 aesKey）。Android 额外 --android-signing
      # 落地 keystore.jks + local.properties。多 ABI 打包：删掉 prepare_flavor 写的 XB_TARGET_ABI，
      # 让 split-per-abi 出全部 ABI（最终 versionCode 由应用 onVariants 统一覆盖为迁移基数加产品构建号）。
      - name: Check prepare flavor with runner Bash
        if: matrix.platform == 'macos'
        run: python tool/test/sentry_release_workflow_test.py ReleaseWorkflowTests.test_prepare_flavor_passes_android_identity_only_to_android ReleaseWorkflowTests.test_empty_array_negative_control

      - name: Prepare flavor
        run: |
          set -euo pipefail
          FLAVOR_ARGS=(--flavor "$FLAVOR" --target prod)
          if [ "${{ matrix.platform }}" = "android" ]; then
            FLAVOR_ARGS+=(--android-signing --android-identity)
          fi
          dart --packages=.dart_tool/package_config.json tool/prepare_flavor.dart "${FLAVOR_ARGS[@]}"
          if [ "${{ matrix.platform }}" = "android" ]; then
            sed -i '/^XB_TARGET_ABI=/d' android/local.properties || true
            echo "✓ 已移除 XB_TARGET_ABI（split-per-abi 出全部 ABI）"
          fi

      # Check real Git checkout bytes before modifying desktop branding inputs.
      - name: Check brand resource checkout
        if: matrix.platform == 'windows'
        run: |
          python tool/flutter_check.py --no-pub tool/test/system_icon_git_checkout_test.dart tool/test/windows_installer_metadata_test.dart tool/test/inject_desktop_brand_test.dart tool/test/prepare_release_context_test.dart

      - name: Check Windows compiled title
        if: matrix.platform == 'windows'
        timeout-minutes: 5
        run: python tool/test/windows_title_encoding_test.py

      # 桌面品牌注入（appName → 窗口标题 / 打包 make_config display_name 等）+ 图标重生成。
      - name: Inject desktop branding
        if: matrix.platform != 'android'
        run: dart --packages=.dart_tool/package_config.json tool/inject_desktop_brand.dart --flavor "$FLAVOR" --platform "${{ matrix.platform }}" --build-number "$BUILD_NUMBER"

      - name: Generate desktop icons
        timeout-minutes: 5
        if: matrix.platform != 'android'
        run: python tool/dart_package.py flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Prepare public release context
        run: dart --packages=.dart_tool/package_config.json tool/prepare_release_context.dart --flavor "$FLAVOR" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --build-number "$BUILD_NUMBER" --source-revision "$BUILD_SOURCE_SHA" --align-package-name

      # Native Assets builds the Core, then binds the Helper to its final hash.
      # The runtime reads libclash's manifest; the old Dart CORE_SHA256 prebuild is retired.

      # 合成 env.json（flavor_defines + APP_ENV + CORE_SHA256 + XB_FORM_A + 版本/构建号/tag）。
      - name: Compose env.json
        run: python tool/release_pipeline.py compose

      # 所有 Mac 出包先在前台解析 Swift 包，保留超时和安全诊断。
      - name: Resolve macOS packages with bounded diagnostics
        timeout-minutes: 15
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          flutter precache --macos
          python tool/test/macos_package_resolution_test.py
          python tool/resolve_macos_packages.py --project-root . --report build/sentry-package-resolution.json --cleanup-stale-prefetch --resolve-timeout 600 --scm-provider system --sample-on-timeout

      # macOS 打包依赖：appdmg（dmg 制作）。
      - name: Install macOS package deps
        timeout-minutes: 10
        if: matrix.platform == 'macos'
        run: npm install -g "appdmg@$(python tool/record_build_environment.py --print-appdmg-pin)"

      # Linux 打包依赖：gtk/appindicator/keybinder + AppImage 所需 patchelf/libfuse2/appimagetool
      # （amd64 + arm64 都出 AppImage，appimagetool 按 arch 选）；rpm 仅 amd64。
      - name: Install Linux package deps
        timeout-minutes: 15
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y xvfb dbus-daemon ninja-build libgtk-3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev locate file squashfs-tools
          # 桌面 WebView（desktop_webview_window）需 webkit2gtk-4.1 + libsoup-3.0（插件 CMake REQUIRED）。
          # sentry-native（原生崩溃上报）CMake find_package(CURL) 需 libcurl dev。
          # flutter_secure_storage_linux 需 libsecret-1 + jsoncpp（arm64 runner 不自带）。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libcurl4-openssl-dev libsecret-1-dev libjsoncpp-dev
          # AppImage 需要 patchelf + FUSE（libfuse2；ubuntu 24.04 改名 libfuse2t64，兜底）。
          sudo apt-get install -y patchelf
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y rpm   # rpm 仅 amd64 出
          fi

      - name: Prepare pinned AppImage tool
        if: matrix.platform == 'linux'
        timeout-minutes: 15
        env:
          APPIMAGETOOL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Token used only for GET to the pinned API; stripped on asset redirects.
          APPIMAGETOOL_BIN="$(python3 tool/prepare_appimagetool.py --target-arch "${{ matrix.arch }}" --print-bin-dir)"
          echo "$APPIMAGETOOL_BIN" >> "$GITHUB_PATH"

      # Formal activation and isolated cold checks share one command implementation.
      - name: Activate flutter_distributor
        timeout-minutes: 12
        run: python tool/distributor_preflight.py activate

      - name: Check distributor cold-start entrypoint
        timeout-minutes: 25
        run: python tool/distributor_preflight.py cold --platform "${{ matrix.platform }}"

      # 打包：按平台选 targets，喂我们的 env.json + split-debug-info（Sentry 符号）。
      # android 加 split-per-abi 出 ARM32/ARM64 两个包；逗号值走独立参数。
      - name: Record build tool versions
        timeout-minutes: 5
        run: python tool/record_build_environment.py --platform "${{ matrix.platform }}"

      - name: Package (flutter_distributor)
        id: package_build
        timeout-minutes: 90
        run: python tool/release_pipeline.py package

      - name: Record final build tool versions
        if: always() && (steps.package_build.outcome == 'success' || steps.package_build.outcome == 'failure')
        timeout-minutes: 5
        run: python tool/record_build_environment.py --platform "${{ matrix.platform }}"

      - name: Normalize artifact names (AppVersion convention)
        timeout-minutes: 10
        run: python tool/release_pipeline.py normalize

      - name: Verify Android installer version and native channels
        if: matrix.platform == 'android'
        run: python tool/check_android_release_contract.py

      - name: Verify selected fallback assets
        run: python tool/check_fallback_assets.py

      # 与本机共用：核对生产配置、准备最终分发匹配符号，再上传并等服务器处理。
      # 所有正式平台均强制凭据；诊断跳过选项不暴露在正式工作流中。
      - name: Prepare, audit and upload matching Sentry symbols
        timeout-minutes: 30
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          SYMBOL_ARGS=(
            --platform "${{ matrix.platform }}" --flavor "$FLAVOR"
            --product-version "$PRODUCT_VERSION" --build-number "$BUILD_NUMBER"
            --source-revision "$BUILD_SOURCE_SHA"
          )
          if [ "${{ matrix.platform }}" = "android" ]; then
            shopt -s nullglob
            SYMBOL_ARGS+=(--expected-abi armeabi-v7a --expected-abi arm64-v8a)
            PACKAGES=(dist/*.apk)
            [ "${#PACKAGES[@]}" -gt 0 ] || { echo "::error::No final APK found for native symbol verification"; exit 1; }
            for package in "${PACKAGES[@]}"; do SYMBOL_ARGS+=(--package "$package"); done
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            NATIVE_ARCH="${{ matrix.arch }}"
            [ "$NATIVE_ARCH" != "amd64" ] || NATIVE_ARCH=x64
            SYMBOL_ARGS+=(--architecture "$NATIVE_ARCH")
          fi
          python tool/postbuild_sentry_symbols.py "${SYMBOL_ARGS[@]}"

      - name: Send controlled desktop symbolication probe
        if: needs.setup.outputs.verify_symbolication == 'true' && matrix.platform != 'android'
        run: |
          set -euo pipefail
          PICK_ARGS=(--build-root build --evidence build/sentry-symbols-evidence.json --output build/sentry-symbolication-selection.json)
          if [ "${{ matrix.platform }}" = macos ]; then
            case "${{ matrix.arch }}" in
              amd64) PICK_ARGS+=(--architecture x86_64) ;;
              arm64) PICK_ARGS+=(--architecture arm64) ;;
              *) echo 'Unsupported Mac symbolication architecture'; exit 1 ;;
            esac
          fi
          python tool/pick_sentry_symbolication_probe.py "${PICK_ARGS[@]}"
          python tool/sentry_desktop_symbolication_probe.py emit --evidence build/sentry-symbols-evidence.json --defines flavor_defines.json --selection build/sentry-symbolication-selection.json --report build/sentry-symbolication-probe.json

      - name: Verify only the newly sent symbolication event
        if: needs.setup.outputs.verify_symbolication == 'true' && matrix.platform != 'android'
        env:
          SENTRY_MAINTENANCE_TOKEN: ${{ secrets.SENTRY_MAINTENANCE_TOKEN }}
        run: python tool/sentry_desktop_symbolication_probe.py verify --report build/sentry-symbolication-probe.json

      - name: Preserve safe Sentry symbol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentry-symbol-evidence-${{ env.FLAVOR }}-${{ matrix.platform }}-${{ matrix.arch || 'default' }}
          path: |
            build/sentry-symbols-evidence.json
            build/sentry-native-preparation.json
            build/sentry-symbolication-probe.json
            build/sentry-package-resolution.json
            build/dependency-retries/
            build/windows-iscc-preflight.json
            build/windows-title-preflight.json
            build/distributor-preflight/
            build/release-context.json
            build/release-artifacts.json
            build/android-release-contract/
            build/fallback-assets-evidence.json
            build/toolchain-versions.json
            build/appimage-elf-audit.json
            build/linux-package-audit.json
            build/macos/sentry-inventory-validation.json
            build/macos/sentry-native-inventory.json
            build/macos/sentry-native-build.json
            build/macos/sentry-manifest-diagnostics.json
            build/macos/sentry-symbol-preparation.json
            build/sentry-diagnostics/macos/
          if-no-files-found: ignore
          retention-days: 30

      # 列出产物清单（始终执行，便于核对构建/打包/命名是否正常，但不上传）。
      - name: Verify final distribution manifest
        timeout-minutes: 10
        run: python tool/release_pipeline.py verify

      - name: List built artifacts (no upload)
        run: |
          echo "=== dist 产物（验证构建+命名；upload=${{ needs.setup.outputs.upload }}）==="
          ls -la dist/ 2>/dev/null || echo "(无 dist)"

      # 发布到草稿 Release（upload=true 时）。
      # 为什么用草稿 Release 而非 Artifacts：① Artifacts 下载永远是 zip 包，不是直接的安装包；
      # ② 草稿 Release 的资产是直链原文件（omo-x.y.z-...-setup.exe 直接下），且**仅仓库协作者可见**
      # （公众看不到），测完可随时删。完美匹配"测试期要真安装包又不公开"。
      # 并行 matrix 多 job 发到同一个草稿（tag=pkg-<flavor>-v<版本>）：幂等创建 + --clobber 覆盖，
      # 不同平台文件名不同不冲突；重跑同版本会覆盖同名资产。草稿不创建 git tag，不污染 tag 列表。
      - name: Publish to draft Release
        timeout-minutes: 15
        if: needs.setup.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: pkg-${{ env.FLAVOR }}-v${{ env.PRODUCT_VERSION }}
          TITLE: ${{ env.FLAVOR }} v${{ env.PRODUCT_VERSION }} (build ${{ env.BUILD_NUMBER }})
        run: |
          set -euo pipefail
          NOTES="自动构建（草稿，仅协作者可见，测试完可删）。flavor=${FLAVOR} 版本=${PRODUCT_VERSION} build=${BUILD_NUMBER}"
          # 幂等创建草稿（并行 job 抢创建：后者命中"已存在"→ || true 不致命）
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              || true
          fi
          # 等草稿就绪（防并行创建竞态：本 job 没创建但另一 job 正在建）
          for i in $(seq 1 10); do
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && break
            echo "等待草稿 Release 就绪… (${i})"; sleep 3
          done
          # 已有公开版本不能作为草稿覆盖。
          IS_DRAFT="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Expected a draft Release; refusing to change a published version"
            exit 1
          fi
          # 上传本平台产物（直链原文件；--clobber 覆盖同名，便于重跑）
          # ⚠️ macOS /bin/bash 3.2：变量紧跟中文必须用 ${VAR} 花括号，否则会吞字节报 unbound（PATCHES 经验 #3）
          python tool/release_pipeline.py upload
          # 同名草稿重复使用时，标题也同步为本次实际编号。
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes "${NOTES}"
          echo "✓ 已发布到草稿 Release：${TAG}（仅协作者可见，直链下载真安装包）"

  # 发布成功后，下次编号至少为本批次编号+1；不降低已被其他发布推进的计数。
  # 仅 upload=true（真发布）才自增——纯构建验证（upload=false）不消耗版本号。
  # needs: package → 仅当所有平台 job 成功才跑（任一失败不自增，避免号空耗）。
  # a/b 各自独立计数；只回写本次源分支，标签构建不回写。
  bump:
    needs: [setup, package]
    if: needs.setup.outputs.upload == 'true' && startsWith(needs.setup.outputs.source_ref, 'refs/heads/')
    name: Bump versionCode (next release)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout numbering tool from this run
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 验证构建提交仍是源分支的祖先，不依赖浅克隆边界。
      - name: Increment build_number for flavor
        env:
          FLAVOR: ${{ needs.setup.outputs.flavor }}
          RESOLVED_BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
          BUILD_SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
          BUILD_SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
        run: |
          set -euo pipefail
          # 冻结本次提交的工具，防止重取源分支后执行其他版本。
          NUMBER_TOOL="${RUNNER_TEMP}/release_build_number.py"
          cp tool/release_build_number.py "$NUMBER_TOOL"
          python3 "$NUMBER_TOOL" publish --flavor "$FLAVOR"
