name: B42 existing Windows installer smoke
on:
  push:
    branches: [test/b42-windows-install-20261113]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # GitHub requires push-level access to read draft assets.
    strategy:
      matrix:
        include:
          - arch: amd64
            asset: 737414076
          - arch: arm64
            asset: 737453077
    steps:
      - name: Read fixed draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ matrix.asset }}
        run: |
          mkdir installer
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" --jq '{id,name,size,created_at,updated_at}' > installer/asset.json
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > installer/setup.exe
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('installer/asset.json').read_text())
          assert Path('installer/setup.exe').stat().st_size == meta['size']
          assert Path('installer/setup.exe').read_bytes()[:2] == b'MZ'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: input-installer-${{ matrix.arch }}
          path: installer/
          retention-days: 3
  smoke:
    needs: download
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
            asset: 737414076
          - arch: arm64
            runner: windows-11-arm
            asset: 737453077
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: input-installer-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Record existing installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          Copy-Item "$env:RUNNER_TEMP/asset.json" evidence/asset.json
      - name: Install and inspect startup
        shell: pwsh
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: ./tool/windows_login_probe.ps1
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b42-windows-install-${{ matrix.arch }}
          path: evidence/
          retention-days: 14
