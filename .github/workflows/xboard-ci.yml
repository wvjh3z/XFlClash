# Xboard 模块检查：仅手动执行，不编译安装包或发布产物。
# 正式多平台出包统一使用 release-package.yml。
# 私有依赖：SIBLING_SDK_TOKEN；Docs 使用 DOCS_READ_TOKEN，缺省回退到前者。
# 本工作流不读取品牌配置、签名或 Sentry 上传凭据。
name: Xboard CI

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'SDK commit or immutable tag'
        type: string
        required: true
        default: '1c27b217054ab0fb1b03bd7e248e7921e854cfb0'
      docs_ref:
        description: 'Current documentation commit'
        type: string
        required: true
        default: '2f4609f5d325bec6e6a34bfe06e1a82004bad3a0'

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze + Test (Xboard module)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 校验实际 FlClash 基线需要完整历史
          submodules: recursive # tray_manager/flutter_distributor + core/Clash.Meta submodule（pub get path 依赖需在）
          persist-credentials: false

      - name: Static workflow and shell checks
        timeout-minutes: 5
        run: python3 tool/check_workflow_lints.py --prepare
      - name: Check shared release contracts
        run: python3 tool/check_release_workflow.py

      # actions/checkout 不允许 path 在 workspace 外（`..`）；SDK 是平级 path 依赖，
      # 统一助手在原 sibling 目录拉取，认证只存本 step 的子进程环境。
      - name: Checkout Xboard_sdk (sibling)
        shell: bash
        run: |
          python tool/checkout_sibling_sdk.py --destination "${GITHUB_WORKSPACE}/../Xboard_sdk" --ref "$SDK_REF"
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
          SDK_READ_TOKEN: ${{ secrets.SIBLING_SDK_TOKEN }}

      - name: Checkout current Docs
        uses: actions/checkout@v4
        with:
          repository: wvjh3z/proxy-suite-docs
          ref: ${{ inputs.docs_ref }}
          token: ${{ secrets.DOCS_READ_TOKEN || secrets.SIBLING_SDK_TOKEN }}
          path: .current-docs-checkout
          persist-credentials: false
      - name: Place Docs beside client
        run: mv .current-docs-checkout "${GITHUB_WORKSPACE}/../Docs"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0 # 锁定与 golden 基线生成环境一致（test/xboard/golden 防像素漂移）

      # golden 确定化：装与本地基线同款 CJK 字体（_loadCjkFont 读系统 Noto CJK；
      # 不装则 CI 渲染中文为 tofu → golden 全失配）。详见 test/xboard/golden/README.md。
      - name: Install CJK font (golden determinism)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Check bounded dependency download retries
        run: |
          python3 tool/test/owned_process_cleanup_test.py
          python3 tool/test/pub_get_retry_test.py

      # µ-8 顺序：SDK build_runner → client pub get → client build_runner → analyze → test
      - name: SDK build_runner
        working-directory: ../Xboard_sdk
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tool/pub_get_retry.py" --tool dart --report "$GITHUB_WORKSPACE/build/dependency-retries/sdk.json"
          dart run build_runner build

      - name: Client pub get
        run: python3 tool/pub_get_retry.py --tool flutter --report build/dependency-retries/client.json

      - name: Client build_runner
        run: dart run build_runner build

      # DD-21：FlClash 行号锚点机器校验（接缝点未漂移）。
      - name: Check line anchors (DD-21)
        run: dart run tool/check-line-anchors.dart

      # 接缝点白名单完整性（改 FlClash 既有文件必登记 PATCHES.md）。
      - name: Check seam whitelist
        run: dart run tool/check-seam-whitelist.dart --baseline ac2f6b919ec1ad395b61b4bb1e714a39c750babe

      # 形态 A 复用和主题约束；全量上游差异已由上面的统一白名单检查覆盖。
      - name: Seam import guard (adapter rule)
        run: dart run tool/check_seam_imports.dart

      - name: Theme entrypoint guard (no escape)
        run: dart run tool/check_xb_theme_entrypoints.dart

      - name: Analyze (xboard module, fatal-infos)
        run: flutter analyze lib/xboard

      # DD-20 contract + 全 xboard 单测/widget test（已包含 shell/，无需重复执行）。
      - name: Test (xboard + contract)
        run: flutter test test/xboard/ test/sdk_contract_test.dart test/_fixtures/

      - name: Test desktop installer branding and version injection
        run: flutter test --no-pub tool/test/windows_installer_metadata_test.dart tool/test/inject_desktop_brand_test.dart tool/test/inject_system_icons_cli_test.dart tool/test/prepare_release_context_test.dart

      - name: Test fallback asset selection
        run: dart test tool/test/fallback_assets_test.dart

      - name: Preserve dependency retry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-retry-diagnostics
          path: build/dependency-retries/
          if-no-files-found: ignore
          retention-days: 7
