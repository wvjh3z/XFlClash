# Manual only. No client build, SDK checkout, brand secret restoration or auto-run.
# apply disables project scrubbing and retains future raw dumps. verify sends one
# synthetic info event to each project and checks only those events' stored JSON.
# Requires SENTRY_MAINTENANCE_TOKEN; SENTRY_AUTH_TOKEN remains for symbol uploads.
name: Sentry raw-log maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit is read-only; apply enables raw logs; verify sends synthetic events'
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
          - verify
          - apply-and-verify

permissions:
  contents: read

concurrency:
  group: sentry-project-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check maintenance tool without credentials or network
        run: python3 tool/test/sentry_projects_test.py
      - name: Audit, apply or verify fixed Sentry projects
        env:
          MAINTENANCE_MODE: ${{ inputs.mode }}
          SENTRY_MAINTENANCE_TOKEN: ${{ secrets.SENTRY_MAINTENANCE_TOKEN }}
        shell: bash
        run: |
          case "$MAINTENANCE_MODE" in
            audit|apply|verify|apply-and-verify) ;;
            *) echo 'Invalid maintenance mode'; exit 1 ;;
          esac
          python3 tool/configure_sentry_projects.py --mode "$MAINTENANCE_MODE" --report sentry-report/sentry-raw-logging.json
      - name: Upload safe flags, counts and synthetic probe IDs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentry-raw-logging-safe-report
          path: sentry-report/sentry-raw-logging.json
          if-no-files-found: warn
          retention-days: 7
