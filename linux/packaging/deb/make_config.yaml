priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0
  - libwebkit2gtk-4.1-0
  - libsoup-3.0-0
  - libcurl4

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'unit=/etc/systemd/system/flclash-helper.service'
  - 'if [ ! -L "$unit" ] && grep -Fqx ''ExecStart="/usr/share/FlClash/FlClashHelperService"'' "$unit" 2>/dev/null; then'
  - '  systemctl disable --now flclash-helper.service >/dev/null 2>&1 || true'
  - '  rm -f "$unit"'
  - '  systemctl daemon-reload >/dev/null 2>&1 || true'
  - 'fi'


supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/flclash

keywords:
  - FlClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: FlClash

categories:
  - Network

startup_notify: true

startup_wm_class: com.follow.clash
